<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed in — copy this address</title>
<style>
  body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 20px; line-height: 1.6; color: #eee; background: #14141c; }
  textarea { width: 100%; height: 120px; font-family: Menlo, monospace; font-size: 14px; background: #222; color: #eee; border: 1px solid #555; padding: 8px; }
  button { font-size: 16px; padding: 10px 18px; background: #00B1E9; border: 0; border-radius: 6px; color: #000; cursor: pointer; }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<h1>Signed in</h1>
<p>Copy this address and paste it into the terminal that asked for it:</p>
<textarea id="u" readonly></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('u').value); this.textContent='Copied'">Copy address</button></p>
<script>document.getElementById('u').value = location.href;</script>
</body>
</html>
